[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cisco-cairn"
version = "0.1.0"
description = "Cognitive Artifact Intelligence Research Network — metadata-only AI-malware research toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
  {name = "Ryan Fetterman", email = "fetterm4n@github.com"},
]
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/fetterm4n/CAIRN"
Homepage = "https://fetterm4n.github.io"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
embed = [
  "sentence-transformers>=3.0",
  "hdbscan>=0.8",
]

[project.scripts]
cairn = "cairn.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cairn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
