name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate YARA rules
        run: cairn validate-rules

      - name: Run tests
        run: python -m pytest tests/ --ignore=tests/test_embed.py -v

      - name: Smoke test offline commands
        env:
          CAIRN_DATABASE_PATH: /tmp/cairn_ci.sqlite
        run: |
          cairn filters
          cairn summary
          cairn validate-seeds
          cairn rescan
